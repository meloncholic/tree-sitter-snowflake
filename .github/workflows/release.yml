name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (e.g. v0.1.1)"
        required: true

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Verify before publishing
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.x'
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # v1.97.0
      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Regenerate the parser from grammar.js
        run: npx --yes --package=tree-sitter-cli@0.27.0 -- tree-sitter generate
      - name: Fail if the generated parser is out of date
        run: git diff --exit-code -- src/parser.c src/grammar.json src/node-types.json
      - name: Run corpus and highlight tests
        run: npx --yes --package=tree-sitter-cli@0.27.0 -- tree-sitter test
      - name: Cargo build & test
        run: cargo test

  publish-crate:
    name: Publish to crates.io
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # v1.97.0
      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Publish (skip if this version is already live)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          status=$(curl -s -o /dev/null -w '%{http_code}' "https://crates.io/api/v1/crates/tree-sitter-snowflake/${version}")
          if [ "$status" = "200" ]; then
            echo "tree-sitter-snowflake@${version} is already published, skipping"
          else
            cargo publish
          fi

  publish-npm:
    name: Publish to npm
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.x'
          registry-url: https://registry.npmjs.org/
      - name: Regenerate the parser from grammar.js
        run: npx --yes --package=tree-sitter-cli@0.27.0 -- tree-sitter generate
      - name: Set package version from tag
        run: |
          set -euo pipefail
          version="${TAG#v}"
          npm pkg set "version=${version}"
          VERSION="$version" node -e '
            const fs = require("fs");
            const meta = JSON.parse(fs.readFileSync("tree-sitter.json", "utf8"));
            meta.metadata.version = process.env.VERSION;
            fs.writeFileSync("tree-sitter.json", JSON.stringify(meta, null, 2) + "\n");
          '
      - name: Publish (skip if this version is already live)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          if npm view "tree-sitter-snowflake@${version}" version >/dev/null 2>&1; then
            echo "tree-sitter-snowflake@${version} is already published, skipping"
          else
            npm publish --access public
          fi

  publish-github-packages:
    name: Publish to GitHub Packages
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.x'
          registry-url: https://npm.pkg.github.com
          scope: '@meloncholic'
      - name: Regenerate the parser from grammar.js
        run: npx --yes --package=tree-sitter-cli@0.27.0 -- tree-sitter generate
      - name: Set package name and version for GitHub Packages
        run: |
          set -euo pipefail
          version="${TAG#v}"
          npm pkg set "name=@meloncholic/tree-sitter-snowflake"
          npm pkg set "version=${version}"
      - name: Publish (skip if this version is already live)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          if npm view "@meloncholic/tree-sitter-snowflake@${version}" version >/dev/null 2>&1; then
            echo "@meloncholic/tree-sitter-snowflake@${version} is already published, skipping"
          else
            npm publish --access public
          fi

  github-release:
    name: Create GitHub Release
    needs: [publish-crate, publish-npm, publish-github-packages]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "$TAG" --generate-notes
          fi
